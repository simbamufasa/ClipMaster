name: ClipMaster Rich Clipboard Preview
on:
  push:
    branches: [feature/rich-content-clipboard]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build ClipMaster
        run: dotnet build ClipMaster.csproj -c Release
      - name: Run unit tests
        run: dotnet test ClipMaster.Tests/ClipMaster.Tests.csproj -c Release --no-restore
      - name: Publish self-contained Windows executable
        run: dotnet publish ClipMaster.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compile isolated preview installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup executable not found: $iscc" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipMaster-Rich-Clipboard-Preview-Installer
          path: installer/ClipMaster-Rich-Preview-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ClipMaster-Rich-Clipboard-Preview-Portable
          path: bin/Release/net8.0-windows/win-x64/publish/ClipMaster.exe
          if-no-files-found: error
          retention-days: 30
